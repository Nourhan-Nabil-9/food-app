<div class="auth-login d-flex align-items-center justify-content-center">
  <div class="auth-card container p-5 bg-white shadow">
    <div class="header text-start">
      <div class="logo-container mb-4">
        <img
          src="assets/images/main-logo.png"
          alt="food recipes logo"
          class="main-logo"
        />
      </div>

      <div class="title mb-4">
        <h2 class="fw-bold h4">Forgot Your Password?</h2>
        <p class="text-muted">
          No worries! Please enter your email and we will send a password reset
          link
        </p>
      </div>

      <div class="card-form">
        <form
          [formGroup]="reqResPassForm"
          (ngSubmit)="onSubmit(reqResPassForm)"
        >
          <div class="input-group mb-3 custom-input">
            <span class="input-group-text">
              <i class="fa-regular fa-envelope text-muted"></i>
            </span>

            <div class="v-separator"></div>
            <input
              formControlName="email"
              type="email"
              class="form-control"
              placeholder="Enter your E-mail"
            />
          </div>

          <div
            class="alert alert-danger"
            *ngIf="
              reqResPassForm.get('email')?.errors &&
              reqResPassForm.get('email')?.touched
            "
          >
            <p
              class="my-0"
              *ngIf="reqResPassForm.get('email')?.errors?.['required']"
            >
              Email is requierd
            </p>
            <p
              class="my-0"
              *ngIf="reqResPassForm.get('email')?.errors?.['email']"
            >
              Email is Invalid
            </p>
          </div>

          <button
            [disabled]="reqResPassForm.invalid"
            type="submit"
            class="btn btn-success w-100 py-2 fw-bold login-btn"
          >
            Submit
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
