<div class="auth-login d-flex align-items-center justify-content-center">
  <div class="auth-card container p-5 bg-white shadow">
    <div class="header text-start">
      <div class="logo-container mb-4">
        <img
          src="assets/images/main-logo.png"
          alt="food recipes logo"
          class="main-logo"
        />
      </div>

      <div class="title mb-4">
        <h2 class="fw-bold h4">Log In</h2>
        <p class="text-muted">Welcome Back! Please enter your details</p>
      </div>

      <div class="card-form">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit(loginForm)">
          <div class="input-group mb-3 custom-input">
            <span class="input-group-text">
              <i class="fa-regular fa-envelope text-muted"></i>
            </span>

            <div class="v-separator"></div>
            <input
              formControlName="email"
              type="email"
              class="form-control"
              placeholder="Enter your E-mail"
            />
          </div>

          <div
            class="alert alert-danger"
            *ngIf="
              loginForm.get('email')?.errors && loginForm.get('email')?.touched
            "
          >
            <p
              class="my-0"
              *ngIf="loginForm.get('email')?.errors?.['required']"
            >
              Email is requierd
            </p>
            <p class="my-0" *ngIf="loginForm.get('email')?.errors?.['email']">
              Email is Invalid
            </p>
          </div>
          <div class="input-group mb-2 custom-input password-input-group">
            <span class="input-group-text">
              <i class="fa-solid fa-lock text-muted"></i>
            </span>

            <div class="v-separator"></div>
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              class="form-control"
              placeholder="Password"
            />

            <button
              class="btn toggle-password"
              type="button"
              (click)="togglePassword()"
            >
              <i
                class="fa-regular"
                [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
              ></i>
            </button>
          </div>

          <div
            class="alert alert-danger my-0"
            *ngIf="
              loginForm.get('password')?.errors &&
              loginForm.get('password')?.touched
            "
          >
            <p
              class="my-0"
              *ngIf="loginForm.get('password')?.errors?.['required']"
            >
              Password is reqired
            </p>
            <p
              class="my-0"
              *ngIf="loginForm.get('password')?.errors?.['pattern']"
            >
              Password is Invalid must have Minimum eight characters, at least
              one uppercase letter, one lowercase letter, one number and one
              special character.
            </p>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <a
              routerLink="/auth/register"
              class="auth-link text-dark fw-semibold"
              >Register Now?</a
            >
            <a
              routerLink="/auth/request-reset-password"
              class="auth-link text-success fw-semibold"
              >Forgot Password?</a
            >
          </div>

          <button
            [disabled]="loginForm.invalid"
            type="submit"
            class="btn btn-success w-100 py-2 fw-bold login-btn"
          >
            Login
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
