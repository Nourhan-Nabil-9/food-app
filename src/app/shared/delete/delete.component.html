<div class="p-4 text-center">
  <div class="text-end">
    <button
      (click)="dialogRef.close()"
      class="btn position-absolute top-0 end-0 m-3 border-0 shadow-none z-3"
      style="cursor: pointer"
    >
      <i class="fa-regular fa-circle-xmark text-danger fs-3"></i>
    </button>
  </div>

  <div class="my-3">
    <img
      src="/assets/images/freepik--Character--inject-70.png"
      alt="delete"
      class="w-25"
    />
  </div>

  <h3 class="h5 fw-bold mt-4">Delete {{ data.name }} ?</h3>
  <p class="text-muted px-4">
    are you sure you want to delete this item ? if you are sure just click on
    delete it
  </p>

  <div class="text-end mt-4">
    <button (click)="onDelete()" class="btn btn-outline-danger px-4">
      Delete this item
    </button>
  </div>
</div>
